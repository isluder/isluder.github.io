<!DOCTYPE html>
<html>
<head>
  <meta charSet="utf-8"/>
  <meta name="viewport" content="width=device-width"/>
  <title>Blog Post - Isaac Sluder</title>
  <link rel="shortcut icon" href="/favicon.ico"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous"/>
  <link rel="stylesheet" href="style.css"/>
  <!-- Include marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Styling for markdown content */
    #post-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 1rem 0;
    }
    #post-content h1, #post-content h2, #post-content h3 {
      margin-top: 2rem;
      margin-bottom: 1rem;
    }
    #post-content pre {
      background-color: #f8f9fa;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
    }
    #post-content blockquote {
      border-left: 4px solid #17a2b8;
      padding-left: 1rem;
      color: #6c757d;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="__next">
    <div id="navbar-container"></div>

    <section class="blog-post-section" style="padding-top:100px;padding-bottom:30px">
      <div class="container">
        <div class="row">
          <div class="col-md-8 mx-auto">
            <a href="blog.html" class="btn btn-outline-secondary mb-4">&larr; Back to Blog</a>
            <div id="post-loading" class="text-center">
              <div class="spinner-border text-primary" role="status"></div>
              <p>Loading post...</p>
            </div>
            <div id="post-content" style="display: none;">
              <!-- Markdown content will be rendered here -->
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Floating Toggle Button -->


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
